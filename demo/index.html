<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>react-collage</title>
<style>
  :root { color-scheme: light dark; --ink:#1d1d1b; --muted:#6b6a65; --line:#dcdad3; --bg:#f7f6f2; --accent:#2a78d6; }
  @media (prefers-color-scheme: dark) { :root { --ink:#eeede8; --muted:#9a9890; --line:#34332f; --bg:#141413; --accent:#5b9be6; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 40px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0 0 18px; color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; margin-bottom: 14px; font-size: 14px; }
  .controls label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .controls b { color: var(--ink); font-weight: 500; min-width: 34px; }
  .picks { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); }
  .frame { resize: both; overflow: hidden; width: 100%; max-width: 100%; height: 520px; min-width: 160px; min-height: 120px; border-radius: 10px; outline: 1px solid var(--line); background: var(--line); }
  .facts { color: var(--muted); font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="demo.js"></script>
</body>
</html>
