name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Every package packs
        run: |
          for p in dyna collage react-collage eqsum react-eqsum; do (cd packages/$p && npm pack --dry-run); done
      - name: The Chrome extension builds and type-checks
        run: |
          npm run build
          npx tsc -p chrome-eqsum/tsconfig.json
          sh chrome-eqsum/build.sh
