<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equation Summary</title>
<style>
  body{margin:0;background:#f3f4f6;font:15px/1.5 system-ui,sans-serif;color:#1f2328}
  main{max-width:880px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .muted{color:#6b7280}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:18px;margin:16px 0}
  button,.pick{font:inherit;padding:6px 12px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer}
  button:hover,.pick:hover{border-color:#2563eb;color:#2563eb}
  .drop{border:2px dashed #d1d5db;border-radius:10px;padding:28px;text-align:center}
  .drop.over{border-color:#2563eb;background:#eff6ff}
  code{background:#f3f4f6;padding:1px 5px;border-radius:4px}
</style>
</head>
<body><div id="root"></div><script type="module" src="viewer.js"></script></body>
</html>
